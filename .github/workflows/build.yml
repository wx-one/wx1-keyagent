name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/wx-one/wx1-keyagent

jobs:
  build:
    # meta lowers against the headers of the compiler its image was built
    # with: ubuntu:24.04, so the runner is ubuntu-24.04 and uses its gcc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # meta by tag and digest, in one place: ci/meta-image (build.sh reads it too)
      - id: pin
        run: echo "image=$(cat ci/meta-image)" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/meta
        id: meta
        with:
          image: ${{ steps.pin.outputs.image }}
      - name: build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential curl ca-certificates perl bzip2 xz-utils bison flex jq
      - name: static libraries (cached by ci/deps.sh)
        uses: actions/cache@v4
        with:
          path: out/deps
          key: deps-${{ runner.os }}-${{ hashFiles('ci/deps.sh') }}
      - name: build
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version=0.0.0-${GITHUB_SHA::12}
          export META_REF="${{ steps.pin.outputs.image }}"
          ci/build.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            out/wx1-keyagent-*.tar.gz
            out/wx1-keyagent-*.cdx.json
            out/wx1-keyagent-*.sha256

  image:
    # the release on the hardened Debian 13 seed of container.gov.de, tested
    # with the whole of test/api.sh against CockroachDB, OpenBao and a KBS stub
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: build image
        run: |
          release=$(basename out/wx1-keyagent-*.tar.gz .tar.gz)
          echo "RELEASE=$release" >>"$GITHUB_ENV"
          docker build -q -f ci/Dockerfile.release --build-arg RELEASE="$release" -t wx1-keyagent:ci out
      - name: test/api.sh against the image
        run: RACE_ROUNDS=20 IMAGE=wx1-keyagent:ci NO_BUILD=1 test/local.sh
      - name: image SBOM
        run: |
          sudo apt-get install -y -qq jq >/dev/null
          seed=$(sed -n 's/^ARG SEED=//p' ci/Dockerfile.release)
          docker create --name base-libs wx1-keyagent:ci >/dev/null
          docker cp base-libs:/opt/wx1-keyagent/BASE-LIBS out/BASE-LIBS
          docker rm base-libs >/dev/null
          tag=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag=ci
          ci/sbom.sh image "out/$RELEASE.cdx.json" out/BASE-LIBS "$seed" "$IMAGE:$tag" \
            > "out/$RELEASE.image.cdx.json"
      - name: push image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag=${GITHUB_REF_NAME#v}
          docker tag wx1-keyagent:ci "$IMAGE:$tag"
          docker push -q "$IMAGE:$tag"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag" > "out/$RELEASE.image-digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            out/*.image.cdx.json
            out/*.image-digest
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(cat out/*.image-digest)
          {
            echo "## Binary"
            echo "\`wx1-keyagent-*-linux-x86_64.tar.gz\`: nginx with the agent's module, everything but glibc (>= 2.38) linked statically. SHA-256 in the \`.sha256\` file, SBOM (CycloneDX 1.6) in \`.cdx.json\`, licences in \`THIRD_PARTY_NOTICES\` inside the tarball."
            echo
            echo "## Image"
            echo "\`$image\` - on the hardened Debian 13 runtime seed of container.gov.de. What it adds to the seed: \`.image.cdx.json\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/wx1-keyagent-* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
